name: schoolops_pro
description: "SchoolOpsPro Enterprise Mobile Application for Android and iOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.6.1

  # HTTP Client & Network
  dio: ^5.7.0

  # Storage & Offline Persistence
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation & Routing
  go_router: ^14.6.2

  # Functional Programming & Utilities
  dartz: ^0.10.1
  jwt_decoder: ^2.0.1
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
